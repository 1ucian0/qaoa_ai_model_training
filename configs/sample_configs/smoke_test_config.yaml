# Minimal configuration for smoke-testing the pipeline with synthetic data
# generated by scripts_and_notebooks/make_smoke_test_data.py. Not a real
# training configuration — angles and energies are random, not optimized.
#
# Run with:
#   python -m scripts_and_notebooks.make_smoke_test_data --out_dir /tmp/qaoa_smoke_test
#   python -m scripts_and_notebooks.testset_generation --graphs_repo /tmp/qaoa_smoke_test --instance_sets smoke_test
#   python -m scripts_and_notebooks.build_per_p_split --graphs_repo /tmp/qaoa_smoke_test --target_p 1
#   python -m training.training_script --config configs/sample_configs/smoke_test_config.yaml
#   python -m training.testing_script --config configs/sample_configs/smoke_test_config.yaml \
#     --ckpt_path checkpoints/smoke_test/smoke_test/last.ckpt

seed: 42

data:
  graph_dir: "/tmp/qaoa_smoke_test"
  p: 1
  instance_set: smoke_test
  in_features:
    - num_nodes
    - num_edges
    - edges_per_node
    - mean_degree
    - std_degree
  use_edge_weights: true
  batch_size: 4
  num_workers: 0

model:
  model_type: graph_neural_network
  lr: 5e-4
  num_epochs: 2
  patience: 10
  min_delta: 0.0
  num_timesteps: 0

trainer:
  accelerator: cpu
  devices: auto
  strategy: auto
  log_dir: ./runs
  ckpt_dir: ./checkpoints/smoke_test/
  run_name: smoke_test
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  save_top_k: 1
  save_last: true
